name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Exact rivet pin, in lockstep with ci.yml and acceptance.yml.
  # Deliberately an unreleased main commit (v0.15.2-5): carries the
  # #441/#444 installer fixes movebit needs; re-pin to the next released
  # tag once one contains it. Family policy: rivet is consumed as a
  # package (this pin install), never as a linked source checkout — keeps
  # local and release builds reproducible against one revision, and the
  # setup-embed-racket action ref must stay in lockstep with this pin.
  RIVET_PIN: c2e3760c504677cffe77c06bf30744572992cbf2
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qE "^## (\[)?$TAG(\])?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      # Never publish an unupdatable release: every leg signs through this
      # key, and the aggregate job signs the merged feed with it. A missing
      # secret must stop the pipeline here with a readable reason, not as a
      # garbled DER failure three jobs later.
      - name: Preflight — signing key must match the shipped updater
        env:
          KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_B64}" ]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is missing; refusing an unsigned update feed"
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$KEY_B64" | base64 -d > "$key_dir/private.der"
          python3 scripts/check-release-update-key.py "$key_dir/private.der"

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install pinned Rivet (tag package install)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # release defaults to production mode, so exporting them alone
          # flips packaging over once --development is dropped below.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      # `raco rivet release` defaults to production packaging: with the
      # credentials exported above it Developer ID-signs, notarizes,
      # staples, and re-verifies inside rivet itself.
      - name: Package + branded DMG (rivet release, Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release
          rm -f "$KEY_DER"
        shell: bash
      - name: Package + branded DMG (rivet release, ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Release requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Collect DMG + portable zip + checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          rm -f dist/update-*.json
          # rivet's branded DMG (the dmg-background artwork declared in
          # rivet.rktd, applied with the icon layout) carries no arch in its
          # name — the building machine's arch IS the matrix arch.
          test -f "dist/movebit-${VERSION}-macos.dmg"
          mv "dist/movebit-${VERSION}-macos.dmg" "movebit-${VERSION}-macos-${ARCH}.dmg"
          shasum -a 256 "movebit-${VERSION}-macos-${ARCH}.dmg" \
            > "movebit-${VERSION}-macos-${ARCH}.dmg.sha256"
          # rivet's portable zip (the update feed artifact) with its own
          # sidecar joins the set.
          test -f "dist/movebit-${VERSION}-macos-${ARCH}.zip"
          test -f "dist/movebit-${VERSION}-macos-${ARCH}.zip.sha256"
          mv "dist/movebit-${VERSION}-macos-${ARCH}.zip" \
             "dist/movebit-${VERSION}-macos-${ARCH}.zip.sha256" .
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: movebit-*
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install pinned Rivet (tag package install)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Enable local crash dumps
        shell: pwsh
        run: |
          $dumpDir = "$env:LOCALAPPDATA\CrashDumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$dumpDir" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 5 /f

      - name: Package + installer (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash

      - name: Analyze the packaged-app crash dump (on release-smoke failure)
        if: failure()
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping dump analysis'; exit 0 }
          $dump = Get-ChildItem "$env:TEMP" -Filter 'movebit-crash.dmp' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dump) { Write-Host 'no crash dump was written'; exit 0 }
          Write-Host "analyzing $($dump.FullName)"
          Set-Content -Path 'cdbcmds.txt' -Value '.symfix; .reload; !analyze -v; ~# k; q'
          $p = Start-Process -FilePath $cdb -ArgumentList "-z `"$($dump.FullName)`" -cf cdbcmds.txt" -NoNewWindow -PassThru -RedirectStandardOutput dump-out.txt -RedirectStandardError dump-err.txt
          if (-not $p.WaitForExit(240000)) { $p.Kill() }
          Get-Content dump-out.txt | Select-Object -Last 200
          exit 0

      - name: Collect MSI + portable zip + checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -f dist/update-*.json
          mv dist/*.msi "movebit-${VERSION}-windows-x64.msi"
          sha256sum "movebit-${VERSION}-windows-x64.msi" > "movebit-${VERSION}-windows-x64.msi.sha256"
          # rivet's portable zip (same payload the msi installs) with its own
          # sidecar — the update feed's windows artifact shape. Adopt it
          # instead of re-zipping the payload tree: the release flow packages
          # once and cleans the unpacked tree from dist/ at the end, so a
          # second `raco rivet package` (or Compress-Archive after it) either
          # collides ("copy-file: destination exists") or finds no tree.
          test -f "dist/movebit-${VERSION}-windows-x64.zip"
          test -f "dist/movebit-${VERSION}-windows-x64.zip.sha256"
          mv "dist/movebit-${VERSION}-windows-x64.zip" \
             "dist/movebit-${VERSION}-windows-x64.zip.sha256" .
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: movebit-*
          if-no-files-found: error

  # The Linux host needs an embeddable static libracketcs, which the standard
  # Racket installers do not ship; same recipe as ci.yml's host-linux job.
  # Both family architectures build from source on their native runner
  # (x64: ubuntu-24.04, arm64: ubuntu-24.04-arm); the cache key carries
  # runner.arch so each arch keeps its own embeddable runtime. Each leg
  # runs one `raco rivet release` and adopts rivet's own artifacts: the
  # tar.gz (update-feed payload), the portable zip (+ sidecar), and the
  # native installers (deb, rpm, AppImage — both arches, rivet pins an
  # aarch64 appimagetool), then wraps the tar.gz payload into a Flatpak
  # bundle from the flatpak/ manifest template. The release flow cleans
  # the unpacked payload tree from dist/ at the end, so nothing may
  # re-zip or re-package after.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@c2e3760c504677cffe77c06bf30744572992cbf2
      - name: Install GTK4, a virtual display, and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb file desktop-file-utils squashfs-tools rpm
      # Installed after the embeddable runtime so the dependency closure
      # (cext-lib, crypto-lib, keel) resolves against the minimal build —
      # it ships no packages of its own.
      - name: Install pinned Rivet (tag package install)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Cache appimagetool and its runtime through the authenticated API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in x64) ARCH=x86_64 ;; arm64) ARCH=aarch64 ;; esac
          mkdir -p .rivet/bin
          gh release download 1.9.0 -R AppImage/appimagetool \
            -p "appimagetool-${ARCH}.AppImage" -D .rivet/bin --clobber
          gh release download continuous -R AppImage/type2-runtime \
            -p "runtime-${ARCH}" -D .rivet/bin --clobber
          # appimagetool otherwise downloads the type2 runtime from the same
          # currently-504 public asset URL. Wrap it so rivet's invocation gets
          # the pre-fetched runtime through the documented --runtime-file flag.
          mv ".rivet/bin/appimagetool-${ARCH}.AppImage" \
             ".rivet/bin/appimagetool-${ARCH}.AppImage.real"
          chmod +x ".rivet/bin/appimagetool-${ARCH}.AppImage.real"
          {
            echo '#!/bin/sh'
            echo "exec \"\$(dirname \"\$0\")/appimagetool-${ARCH}.AppImage.real\" --runtime-file \"\$(dirname \"\$0\")/runtime-${ARCH}\" \"\$@\""
          } > ".rivet/bin/appimagetool-${ARCH}.AppImage"
          chmod +x ".rivet/bin/appimagetool-${ARCH}.AppImage"
          test -s ".rivet/bin/runtime-${ARCH}"
      - name: Package (rivet release, development signing)
        shell: bash
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
          # Lets appimagetool (itself an AppImage) run on the runner while
          # rivet assembles the AppImage's GTK4 dependency closure.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          xvfb-run -a raco rivet release --development
          rm -f "$KEY_DER"
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc 2.42 covers the
          # ubuntu-24.04-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "movebit-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.movebit.yml > site.jrtx.movebit.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.movebit.gen.yml
          flatpak build-bundle flatpak-repo \
            "movebit-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.movebit stable
          rm -rf flatpak-build flatpak-repo "movebit-${VERSION}-linux-${ARCH}.tar.gz"
          test -f "movebit-${VERSION}-linux-${ARCH}.flatpak"
      - name: Collect rivet artifacts + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          rm -f dist/update-*.json
          # rivet names the tarball after the building machine's arch, which
          # equals the matrix arch by construction of the runner matrix.
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz"
          mv "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz" .
          # rivet's portable zip (with its own sidecar) joins the set.
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.zip"
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.zip.sha256"
          mv "dist/movebit-${VERSION}-linux-${ARCH}.zip" \
             "dist/movebit-${VERSION}-linux-${ARCH}.zip.sha256" .
          # The native installers keep rivet's ecosystem spellings (deb
          # amd64/arm64, rpm embeds the build number + x86_64/aarch64,
          # AppImage x86_64/aarch64); rename them to the release contract
          # names (deb/AppImage x64|arm64, rpm native arch spelling).
          mv dist/movebit-*-linux-*.deb "movebit-${VERSION}-linux-${ARCH}.deb"
          case "$ARCH" in x64) RPM_ARCH=x86_64 ;; arm64) RPM_ARCH=aarch64 ;; esac
          mv dist/movebit-*-linux-*.rpm "movebit-${VERSION}-linux-${RPM_ARCH}.rpm"
          mv dist/movebit-*-linux-*.AppImage "movebit-${VERSION}-linux-${ARCH}.AppImage"
          # Sidecars for everything rivet did not already checksum.
          for f in movebit-${VERSION}-linux-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: movebit-*
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install pinned Rivet (tag package install)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          python3 scripts/check-release-update-key.py "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Verify signed AppImage feed matches x64/arm64 bytes
        run: python3 scripts/check-signed-appimage-feed.py dist/update-manifest.json dist
      - name: Validate and stage the canonical 18-asset desktop matrix
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.AppImage linux-arm64.deb linux-arm64.flatpak \
            linux-arm64.tar.gz linux-arm64.zip linux-aarch64.rpm \
            linux-x64.AppImage linux-x64.deb linux-x64.flatpak \
            linux-x64.tar.gz linux-x64.zip linux-x86_64.rpm; do
            name="movebit-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty release asset $name"; exit 1; }
            cp "dist/$name" "public/$name"
          done
          cp dist/update-manifest.json public/
          test -s public/update-manifest.json
          cd public
          shasum -a 256 movebit-* | LC_ALL=C sort -k2 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          test "$(grep -c '^' SHA256SUMS)" -eq 18
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          # Accept both heading styles used in this repo's history:
          #   ## 0.0.5 (2026-11-01)      and      ## [0.0.6] (2026-11-08)
          awk -v version="$VERSION" '
            $0 ~ ("^## \\[?" version "\\]?( |$)") {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
          if gh release view "$GITHUB_REF_NAME" -R turlamai/movebit >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R turlamai/movebit --notes-file /tmp/notes.md
            gh release upload "$GITHUB_REF_NAME" public/* --clobber -R turlamai/movebit
          else
            gh release create "$GITHUB_REF_NAME" public/* \
              -R turlamai/movebit \
              --title "MoveBit $VERSION" \
              --notes-file /tmp/notes.md
          fi
          # Keep reruns idempotent without accumulating stale aliases or
          # per-installer sidecars from older pipeline generations.
          gh release view "$GITHUB_REF_NAME" -R turlamai/movebit --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/movebit
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
